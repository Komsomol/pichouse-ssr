name: Deploy to Cloudflare Pages

on:
  # Manual trigger
  workflow_dispatch:

  # No schedule here - the daily build is owned by smart-deploy.yml, which only
  # rebuilds when the Picturehouse data actually changed. This workflow is for
  # code changes (push) and manual runs.
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # needed by keepalive-workflow

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run tests
        run: npm test

      - name: 🏗️ Generate static site
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          COOKIE: ${{ secrets.COOKIE }}
        run: npm run generate

      - name: 📊 Show build output
        run: |
          echo "Build completed!"
          ls -la .output/public/ | head -20
          du -sh .output/public/

      - name: 🚀 Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          wrangler pages project create pichouse-ssr --production-branch main 2>/dev/null || true
          wrangler pages deploy .output/public --project-name pichouse-ssr --branch main

      - name: ✅ Deployment complete
        run: |
          echo "🎉 Deployment successful!"
          echo "📺 Your site is live at: https://pichouse-ssr.pages.dev"
          echo "⏰ Daily data rebuilds are handled by smart-deploy.yml"

      # GitHub auto-disables scheduled workflows after 60 days without repo
      # activity (this took the site down June 16 - July 7 2026). Re-enabling
      # the workflow via the API on every run resets that timer.
      - name: 🔄 Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

