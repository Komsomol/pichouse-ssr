name: Smart Deploy (Only if Data Changed)

on:
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if data unchanged'
        required: false
        default: false
        type: boolean

  # Scheduled trigger - daily at 06:37 UTC.
  #
  # Not on the hour. GitHub's schedule event is best-effort: it queues on a
  # shared pool, slips under load, and gets dropped outright when the queue is
  # deep - and the top of the hour is the most contended minute there is. On
  # '0 6 * * *' this ran on time until 26 Aug 2026, then 5-12h late every day,
  # then missed 1 Sep entirely. That miss is why the 31 Aug outage was still
  # live the next morning instead of self-healing on the next run.
  schedule:
    - cron: '37 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # >=22 required: eslint-plugin-unicorn (via @nuxt/eslint-config) uses
  # Set.prototype.union, which does not exist on Node 20.
  NODE_VERSION: '22'
  DATA_HASH_FILE: '.data-hash'

jobs:
  check-for-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # needed by keepalive-workflow
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      movie_count: ${{ steps.check.outputs.movie_count }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Must run BEFORE the check step - it populates $DATA_HASH_FILE with the
      # previous run's hash so the comparison below has something to compare to.
      - name: 📤 Restore previous data hash
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DATA_HASH_FILE }}
          key: data-hash-${{ github.run_id }}
          restore-keys: |
            data-hash-

      - name: 🔍 Fetch current movie data and check for changes
        id: check
        env:
          COOKIE: ${{ secrets.COOKIE }}
        run: |
          # Fetch movie data from Picturehouse API
          echo "Fetching movie data..."

          # --retry covers the 5xx the gateway returns when it gives up on this
          # 3.5MB response; --max-time keeps a hung attempt from eating a minute.
          RESPONSE=$(curl -s -X POST "https://www.picturehouses.com/api/get-movies-ajax?start_date=show_all_dates&cinema_id=029" \
            -H "Content-Type: application/x-www-form-urlencoded; charset=UTF-8" \
            -H "Accept: */*" \
            -H "Origin: https://www.picturehouses.com" \
            -H "X-Requested-With: XMLHttpRequest" \
            -H "Cookie: $COOKIE" \
            --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors \
            --data "" 2>/dev/null || echo '{"movies":[]}')

          # Extract movie titles and showtimes to create a hash
          # This creates a fingerprint of the current movie schedule
          NEW_HASH=$(echo "$RESPONSE" | node -e "
            const chunks = [];
            process.stdin.on('data', c => chunks.push(c));
            process.stdin.on('end', () => {
              try {
                const data = JSON.parse(Buffer.concat(chunks).toString());
                const movies = data.movies || [];
                // Create fingerprint from titles and showtime counts
                const fingerprint = movies
                  .map(m => m.Title + ':' + (m.show_times?.length || 0))
                  .sort()
                  .join('|');
                const crypto = require('crypto');
                console.log(crypto.createHash('md5').update(fingerprint).digest('hex'));
              } catch (e) {
                console.log('error');
              }
            });
          ")

          MOVIE_COUNT=$(echo "$RESPONSE" | node -e "
            const chunks = [];
            process.stdin.on('data', c => chunks.push(c));
            process.stdin.on('end', () => {
              try {
                const data = JSON.parse(Buffer.concat(chunks).toString());
                console.log(data.movies?.length || 0);
              } catch (e) {
                console.log(0);
              }
            });
          ")

          echo "New data hash: $NEW_HASH"
          echo "Movie count: $MOVIE_COUNT"
          echo "movie_count=$MOVIE_COUNT" >> $GITHUB_OUTPUT

          # Get previous hash from cache or artifact
          OLD_HASH=""
          if [ -f "$DATA_HASH_FILE" ]; then
            OLD_HASH=$(cat "$DATA_HASH_FILE")
          fi
          echo "Previous hash: $OLD_HASH"

          # Check if force deploy
          FORCE="${{ github.event.inputs.force_deploy }}"

          # Determine if we should deploy
          if [ "$FORCE" = "true" ]; then
            echo "🔄 Force deploy requested"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [ "$NEW_HASH" = "error" ]; then
            # Do NOT deploy on a failed fetch. The build would hit the same
            # broken upstream and generate a page whose only content is an
            # error, replacing a working site with it - which is how 31 Aug
            # 2026 went. Holding leaves the last good deploy up.
            echo "⚠️ Failed to fetch Picturehouse data. Holding the current deploy."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "skip_reason=Picturehouse fetch failed - the current deploy was left in place." >> $GITHUB_OUTPUT
          elif [ "$NEW_HASH" != "$OLD_HASH" ]; then
            echo "✨ Data has changed! Will deploy."
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "😴 No changes detected. Skipping deploy."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "skip_reason=No changes in movie data." >> $GITHUB_OUTPUT
          fi

          # Save new hash for comparison. A failed fetch is not a data state, so
          # it is never recorded - otherwise two failures in a row compare equal
          # and the outage looks like "no changes".
          if [ "$NEW_HASH" != "error" ]; then
            echo "$NEW_HASH" > "$DATA_HASH_FILE"
          fi

      # Saved unconditionally: on a skipped deploy the hash is unchanged, but
      # re-saving keeps the cache entry from being evicted after 7 days idle.
      # The run_id in the key makes it unique, so the save never collides.
      - name: 💾 Cache data hash
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DATA_HASH_FILE }}
          key: data-hash-${{ github.run_id }}

      # GitHub auto-disables scheduled workflows after 60 days without repo
      # activity (this took the site down June 16 - July 7 2026). Re-enabling
      # the workflow via the API on every run resets that timer.
      - name: 🔄 Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/smart-deploy.yml/enable"

  build-and-deploy:
    needs: check-for-updates
    if: needs.check-for-updates.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run tests
        run: npm test

      - name: 🏗️ Generate static site
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          COOKIE: ${{ secrets.COOKIE }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: npm run generate

      - name: 📊 Build summary
        run: |
          echo "### 🎬 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Movies found:** ${{ needs.check-for-updates.outputs.movie_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build size:** $(du -sh .output/public/ | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

      - name: 🚀 Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          wrangler pages project create pichouse-ssr --production-branch main 2>/dev/null || true
          wrangler pages deploy .output/public --project-name pichouse-ssr --branch main

      - name: ✅ Post deployment summary
        run: |
          echo "### 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL:** https://pichouse-ssr.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Next check:** Tomorrow at 06:37 UTC" >> $GITHUB_STEP_SUMMARY

  skip-notification:
    needs: check-for-updates
    if: needs.check-for-updates.outputs.should_deploy == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: 😴 Deployment skipped
        run: |
          echo "### 😴 Skipped Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.check-for-updates.outputs.skip_reason }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Movies in API:** ${{ needs.check-for-updates.outputs.movie_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Next check:** Tomorrow at 06:37 UTC" >> $GITHUB_STEP_SUMMARY

